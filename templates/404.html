<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRM.FAIR — Page introuvable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f5f7; --bg2: #ffffff;
      --text: #111827; --muted: #4b5563; --hint: #9ca3af;
      --border: rgba(0,0,0,0.07); --border2: rgba(0,0,0,0.13);
      --teal: #0d9470; --teal-bg: rgba(13,148,112,0.09);
    }
    html, body { height: 100%; }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .wrap { text-align: center; max-width: 400px; display: flex; flex-direction: column; gap: 20px; }
    .code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 72px; font-weight: 500;
      color: var(--teal); letter-spacing: -2px; line-height: 1;
    }
    .title { font-size: 18px; font-weight: 500; }
    .sub { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .logo {
      font-family: 'IBM Plex Mono', monospace; font-size: 14px;
      color: var(--hint); letter-spacing: 0.1em;
    }
    .logo em { color: var(--teal); font-style: normal; }
    a.btn {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace; font-size: 12px;
      background: var(--teal); color: #fff; border-radius: 4px;
      padding: 10px 24px; text-decoration: none;
      transition: opacity 0.15s;
    }
    a.btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">IRM<em>.</em>FAIR</div>
    <div class="code">404</div>
    <div class="title">Page introuvable</div>
    <div class="sub">
      La ressource demandée n'existe pas ou a été déplacée.<br>
      Vérifiez l'URL ou revenez à l'accueil.
    </div>
    <div>
      <a href="/" class="btn">← Retour à l'accueil</a>
    </div>
  </div>
</body>
</html>
