<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>IRM.FAIR — Vérification 2FA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f5f7; --bg2: #ffffff; --bg3: #f0f2f5;
      --text: #111827; --muted: #4b5563; --hint: #9ca3af;
      --border: rgba(0,0,0,0.07); --border2: rgba(0,0,0,0.13);
      --teal: #ea7c1c; --teal-dim: #c8651a; --teal-bg: rgba(234,124,28,0.10);
      --red: #dc2626; --red-bg: rgba(220,38,38,0.08);
    }
    html, body { height: 100%; min-height: 100dvh; }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 20px 16px;
    }
    .wrap {
      width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: 24px;
      animation: fadeUp 0.35s ease both;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .logo { font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:500;
            letter-spacing:.1em; text-align:center; }
    .logo em { color:var(--teal); font-style:normal; }
    .sub  { font-size:11px; color:var(--hint); text-align:center;
            font-family:'IBM Plex Mono',monospace; margin-top:4px; }
    .card {
      background:var(--bg2); border:1px solid var(--border); border-radius:6px;
      padding:28px 24px; display:flex; flex-direction:column; gap:18px;
      box-shadow:0 2px 12px rgba(0,0,0,0.06);
    }
    .card-icon {
      width:52px; height:52px; border-radius:50%;
      background:var(--teal-bg); border:2px solid rgba(234,124,28,0.22);
      display:flex; align-items:center; justify-content:center;
      font-size:22px; margin:0 auto 4px;
    }
    h2 { font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:500;
         text-align:center; }
    p  { font-size:12px; color:var(--muted); text-align:center; line-height:1.6; }
    .form-label {
      font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.12em;
      text-transform:uppercase; color:var(--hint);
    }
    /* Code input numérique large */
    .code-input {
      font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:500;
      letter-spacing:0.35em; text-align:center;
      background:var(--bg3); border:1px solid var(--border2); border-radius:4px;
      padding:14px 12px; color:var(--text); outline:none; width:100%;
      transition:border-color .15s, box-shadow .15s;
    }
    .code-input:focus {
      border-color:var(--teal-dim);
      box-shadow:0 0 0 3px var(--teal-bg);
    }
    .btn-login {
      font-family:'IBM Plex Mono',monospace; font-size:13px;
      background:var(--teal); color:#fff; border:none; border-radius:4px;
      padding:13px; cursor:pointer; font-weight:500; width:100%;
      letter-spacing:.04em; transition:opacity .15s;
      -webkit-tap-highlight-color:transparent;
    }
    .btn-login:hover { opacity:.85; }
    .error-msg {
      font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--red);
      background:var(--red-bg); border:1px solid rgba(240,68,56,0.2);
      border-radius:4px; padding:10px 12px; line-height:1.6; text-align:center;
    }
    .back { font-size:11px; color:var(--hint); text-align:center;
            font-family:'IBM Plex Mono',monospace; }
    .back a { color:var(--hint); text-decoration:none; }
    .back a:hover { color:var(--teal); }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="logo">IRM<em>.</em>FAIR</div>
      <div class="sub">Authentification à deux facteurs</div>
    </div>

    <div class="card">
      <div class="card-icon">🔐</div>
      <h2>Code de vérification{% if username %} — {{ username }}{% endif %}</h2>
      <p>Ouvrez votre application d'authentification (Google Authenticator, Aegis, Authy…) et entrez le code à 6 chiffres.</p>

      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div style="display:flex;flex-direction:column;gap:14px;">
          <div>
            <label class="form-label" for="code-input">Code à 6 chiffres</label>
            <input class="code-input" type="text" id="code-input" name="code"
                   inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7"
                   placeholder="• • • • • •" autofocus autocomplete="one-time-code">
          </div>
          <button class="btn-login" type="submit">Vérifier →</button>
        </div>
      </form>
    </div>

    <div class="back"><a href="/login">← Retour à la connexion</a></div>
  </div>

<script>
/* Auto-soumettre quand 6 chiffres sont saisis */
document.getElementById('code-input').addEventListener('input', function() {
  const digits = this.value.replace(/\s/g, '');
  if (digits.length === 6 && /^\d{6}$/.test(digits)) {
    this.form.submit();
  }
});
</script>
</body>
</html>
