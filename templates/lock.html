<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>IRM.FAIR — Session verrouillée</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f5f7; --bg2: #ffffff; --bg3: #f0f2f5;
      --text: #111827; --muted: #4b5563; --hint: #9ca3af;
      --border: rgba(0,0,0,0.07); --border2: rgba(0,0,0,0.13);
      --teal: #ea7c1c; --teal-dim: #c8651a; --teal-bg: rgba(234,124,28,0.10);
      --red: #dc2626; --red-bg: rgba(220,38,38,0.08);
    }
    html, body { height: 100%; min-height: 100dvh; }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .wrap {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      animation: fadeUp 0.35s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .logo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--text);
      text-align: center;
    }
    .logo em { color: var(--teal); font-style: normal; }
    .sub {
      font-size: 11px;
      color: var(--hint);
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      margin-top: 4px;
    }
    .lock-icon {
      text-align: center;
      font-size: 28px;
      margin-bottom: -8px;
      opacity: 0.35;
    }
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
    }
    .user-badge .avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--teal-bg);
      border: 1px solid rgba(234,124,28,0.28);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--teal); font-weight: 500;
      flex-shrink: 0;
    }
    .form-row { display: flex; flex-direction: column; gap: 6px; }
    .form-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--hint);
    }
    .form-input {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 12px 14px;
      color: var(--text);
      outline: none;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus {
      border-color: var(--teal-dim);
      box-shadow: 0 0 0 3px var(--teal-bg);
    }
    .pw-field { position: relative; }
    .pw-field .form-input { padding-right: 44px; }
    .pw-eye {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
      color: var(--hint); line-height: 0; transition: color 0.15s;
    }
    .pw-eye:hover { color: var(--teal); }
    .btn-unlock {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 13px;
      cursor: pointer;
      font-weight: 500;
      width: 100%;
      letter-spacing: 0.04em;
      transition: opacity 0.15s;
    }
    .btn-unlock:hover { opacity: 0.85; }
    .btn-logout {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      background: transparent;
      color: var(--hint);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 10px;
      cursor: pointer;
      width: 100%;
      letter-spacing: 0.04em;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-logout:hover { color: var(--red); border-color: rgba(220,38,38,0.35); }
    .error-msg {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--red);
      background: var(--red-bg);
      border: 1px solid rgba(240,68,56,0.2);
      border-radius: 4px;
      padding: 10px 12px;
      line-height: 1.6;
    }
    .divider {
      display: flex; align-items: center; gap: 10px;
      font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--hint);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border2);
    }
    @media (max-width: 400px) {
      body { padding: 16px 12px; align-items: flex-start; padding-top: 40px; }
      .wrap { max-width: 100%; }
      .card { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="logo">IRM<em>.</em>FAIR</div>
      <div class="sub">Session verrouillée par inactivité</div>
    </div>

    <div class="card">
      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}

      <div class="lock-icon">🔒</div>

      <div class="user-badge">
        <div class="avatar">{{ username[0] | upper }}</div>
        <span>{{ username }}</span>
      </div>

      <form method="POST" action="/unlock">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div style="display:flex;flex-direction:column;gap:14px;">
          <div class="form-row">
            <label class="form-label" for="pw-input">Mot de passe</label>
            <div class="pw-field">
              <input class="form-input" type="password" id="pw-input" name="password"
                     placeholder="••••••••••••" autocomplete="current-password" autofocus>
              <button type="button" class="pw-eye" onclick="togglePw()" title="Afficher / masquer">
                <svg id="eye-on" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg id="eye-off" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <button class="btn-unlock" type="submit" name="action" value="unlock">
            Déverrouiller →
          </button>

          <div class="divider">ou</div>

          <button class="btn-logout" type="submit" name="action" value="logout">
            Se déconnecter
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
  function togglePw() {
    const inp  = document.getElementById('pw-input');
    const on   = document.getElementById('eye-on');
    const off  = document.getElementById('eye-off');
    const show = inp.type === 'text';
    inp.type       = show ? 'password' : 'text';
    on.style.display  = show ? '' : 'none';
    off.style.display = show ? 'none' : '';
  }
  </script>
</body>
</html>
