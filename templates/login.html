<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>IRM.FAIR — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  {% if recaptcha_site_key %}
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  {% endif %}
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f5f7; --bg2: #ffffff; --bg3: #f0f2f5;
      --text: #111827; --muted: #4b5563; --hint: #9ca3af;
      --border: rgba(0,0,0,0.07); --border2: rgba(0,0,0,0.13);
      --teal: #0d9470; --teal-dim: #0a7a5c; --teal-bg: rgba(13,148,112,0.09);
      --red: #dc2626; --red-bg: rgba(220,38,38,0.08);
    }
    html, body {
      height: 100%;
      min-height: 100dvh;
    }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .login-wrap {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      animation: fadeUp 0.4s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .login-logo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--text);
      text-align: center;
    }
    .login-logo em { color: var(--teal); font-style: normal; }
    .login-sub {
      font-size: 11px;
      color: var(--hint);
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      margin-top: 4px;
    }
    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .form-row { display: flex; flex-direction: column; gap: 6px; }
    .form-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--hint);
    }
    .form-input {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 12px 14px;
      color: var(--text);
      outline: none;
      width: 100%;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus {
      border-color: var(--teal-dim);
      box-shadow: 0 0 0 3px var(--teal-bg);
    }
    /* Champ mot de passe avec bouton SVG */
    .pw-field { position: relative; }
    .pw-field .form-input { padding-right: 44px; }
    .pw-eye {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
      color: var(--hint); line-height: 0; transition: color 0.15s;
    }
    .pw-eye:hover { color: var(--teal); }
    .pw-eye svg { display: block; }
    .btn-login {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      background: var(--teal);
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 13px;
      cursor: pointer;
      font-weight: 500;
      width: 100%;
      margin-top: 4px;
      letter-spacing: 0.04em;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-login:hover { opacity: 0.85; }
    .btn-login:active { opacity: 0.75; }
    .error-msg {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--red);
      background: var(--red-bg);
      border: 1px solid rgba(240,68,56,0.2);
      border-radius: 4px;
      padding: 10px 12px;
      line-height: 1.6;
    }
    .login-hint {
      font-size: 11px;
      color: var(--hint);
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
    }
    .forgot-link {
      display: block;
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--hint);
      text-decoration: none;
      transition: color 0.12s;
    }
    .forgot-link:hover { color: var(--teal); }
    .captcha-q {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--teal);
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    #captcha-row {
      background: var(--teal-bg);
      border: 1px solid rgba(13,148,112,0.18);
      border-radius: 4px;
      padding: 10px 12px;
    }

    /* Mobile : prend toute la largeur */
    @media (max-width: 400px) {
      body { padding: 16px 12px; align-items: flex-start; padding-top: 40px; }
      .login-wrap { max-width: 100%; }
      .login-card { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div>
      <div class="login-logo">IRM<em>.</em>FAIR</div>
      <div class="login-sub">Plateforme de gestion IRM préclinique</div>
    </div>

    <div class="login-card">
      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}
      <form method="POST" action="/login">
        <div style="display:flex;flex-direction:column;gap:16px;">
          <div class="form-row">
            <label class="form-label" for="login-user">Identifiant</label>
            <input class="form-input" type="text" id="login-user" name="username"
                   placeholder="user" autofocus autocomplete="username">
          </div>

          <div class="form-row">
            <label class="form-label" for="pw-input">Mot de passe</label>
            <div class="pw-field">
              <input class="form-input" type="password" id="pw-input" name="password"
                     placeholder="••••••••••••" autocomplete="current-password">
              <button type="button" class="pw-eye" id="pw-toggle"
                      onclick="togglePw()" title="Afficher / masquer" aria-label="Afficher le mot de passe">
                <!-- Icône œil SVG — état masqué -->
                <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <!-- Icône œil barré — état visible -->
                <svg id="eye-off-icon" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                     style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          {% if recaptcha_site_key %}
          <div style="display:flex;justify-content:center;">
            <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div>
          </div>
          {% elif captcha_question %}
          <div class="form-row" id="captcha-row">
            <label class="form-label" for="captcha-input">
              Vérification — combien font&nbsp;<span class="captcha-q">{{ captcha_question }}</span>&nbsp;?
            </label>
            <input class="form-input" type="number" id="captcha-input" name="captcha_answer"
                   placeholder="Réponse…" autocomplete="off" required inputmode="numeric">
          </div>
          {% endif %}

          <button class="btn-login" type="submit">Connexion →</button>
          <a href="/forgot-password" class="forgot-link">Mot de passe oublié ?</a>
        </div>
      </form>
    </div>

    <div class="login-hint">Comptes démo : admin / admin123</div>
  </div>

<script>
function togglePw() {
  const inp     = document.getElementById('pw-input');
  const eyeOn   = document.getElementById('eye-icon');
  const eyeOff  = document.getElementById('eye-off-icon');
  const showing = inp.type === 'text';
  inp.type          = showing ? 'password' : 'text';
  eyeOn.style.display  = showing ? '' : 'none';
  eyeOff.style.display = showing ? 'none' : '';
}
</script>
</body>
</html>
