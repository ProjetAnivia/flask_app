# ─────────────────────────────────────────────────
#  docker-compose.yml — IRM FAIR
#  Version LOCAL (Mac) — identique au NAS, seuls les volumes changent
# ─────────────────────────────────────────────────

services:

  irm-app:
    build: .
    image: irm-fair:latest
    container_name: irm_fair_app
    restart: unless-stopped

    ports:
      - "5001:5000"

    # Charge les secrets depuis le fichier .env (git-ignoré)
    # Voir .env.example pour la liste des variables disponibles
    env_file:
      - .env

    environment:
      - NAS_ROOT=/nas/structured
      - DB_DIR=/data
      # ── Synchronisation Google Calendar ─────────────────────────────
      # Le fichier JSON du service account est monté en lecture seule
      # depuis ./secrets (voir volumes ci-dessous). On peut surcharger
      # GOOGLE_CALENDAR_ID dans le .env.
      - GOOGLE_CALENDAR_CREDENTIALS_PATH=/secrets/google_calendar_sa.json
      - GOOGLE_CALENDAR_ENABLED=true

    volumes:
      # ── LOCAL MAC ──────────────────────────────
      # Dossier nas_simule créé automatiquement à côté de flask_app
      - ./nas_simule:/nas

      # Base SQLite persistée en local
      - ./db:/data

      # Credentials Google Calendar (lecture seule, jamais commités)
      - ./secrets:/secrets:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ── Pour déployer sur le NAS Synology :
# Remplacer les volumes par :
#   - /volume1/IRM_preclinique:/nas
#   - /volume1/IRM_preclinique/db:/data
